name: Build Windows Client

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"

jobs:
  # ── 1. Generate flutter-rust-bridge files on Linux ───────────────────────────
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install bridge tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen \
            --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} \
            --features "uuid" --locked
          cd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          # pub get crashes in the advisory-reporting phase (dart bug fixed in 3.5+)
          # but packages and pubspec.lock are written correctly before the crash
          flutter pub get || true
          test -f pubspec.lock

      - name: Generate bridge
        run: |
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  # ── 2. Build Windows x86_64 (MSVC) ──────────────────────────────────────────
  build-windows:
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Precache Flutter Windows engine and apply RustDesk custom engine
        shell: pwsh
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $enginePath = (Get-Item "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/").FullName
          Move-Item -Force windows-x64-release/* $enginePath

      - name: Apply Flutter patch
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
             $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Export vcpkg cache env
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk (Rust + Flutter)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
        run: |
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Pub\Cache\advisory" -ErrorAction SilentlyContinue
          python3 .\build.py --hwcodec --flutter --vram

      - name: Rename installer for distribution
        shell: pwsh
        run: |
          $src = "rustdesk-${{ env.VERSION }}-install.exe"
          $dst = "rustdesk-${{ env.VERSION }}-x86_64.exe"
          Copy-Item $src $dst
          Write-Host "Installer size: $((Get-Item $dst).Length / 1MB) MB"

      # ── Distribution ────────────────────────────────────────────────────────
      # Primary path: copy the installer straight to the Omnia server over SSH.
      # Nothing is published on GitHub, so the download stays off the public repo.
      # Requires these repository secrets (Settings → Secrets and variables → Actions):
      #   DEPLOY_HOST         server hostname (e.g. omniasolutions.eu)
      #   DEPLOY_USER         ssh user
      #   DEPLOY_PATH         absolute dir on the server (e.g. /var/www/support/windows)
      #   DEPLOY_SSH_KEY      full private key (the matching public key in the server's authorized_keys)
      #   DEPLOY_PORT         (optional) ssh port, defaults to 22
      #   DEPLOY_KNOWN_HOSTS  (optional) output of `ssh-keyscan -p <port> <host>` for strict host verification
      - name: Deploy installer to Omnia server
        if: ${{ secrets.DEPLOY_HOST != '' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          PORT="${DEPLOY_PORT:-22}"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          fi
          scp -i "$HOME/.ssh/deploy_key" -P "$PORT" $SSH_OPTS \
            "rustdesk-${VERSION}-x86_64.exe" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          rm -f "$HOME/.ssh/deploy_key"

      # Fallback only while DEPLOY_* secrets are not configured (e.g. first test runs).
      # On a public repo this artifact is downloadable by anyone who can see the run,
      # so it is skipped as soon as SSH deployment is set up.
      - name: Upload artifact (fallback, no server configured)
        if: ${{ secrets.DEPLOY_HOST == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-windows-x86_64
          path: rustdesk-${{ env.VERSION }}-x86_64.exe
